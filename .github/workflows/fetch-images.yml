# One-time job: copies the event photos off the old WordPress site into this repo,
# then rebuilds the pages so they use the self-hosted copies.
# Run it from GitHub: Actions > "Self-host photos" > Run workflow. Do this BEFORE pointing DNS away from WordPress.
name: Self-host photos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: bash _build/fetch_images.sh
      - run: python3 _build/build.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Self-host event photos"
          git push
